[workspace]
resolver = "2"
members = [
    "crates/klarbog-types",
    "crates/klarbog-journal",
    "crates/klarbog-store-sqlite",
    "crates/klarbog-core",
    "crates/klarbog-plugin",
    "crates/klarbog-api",
    "crates/klarbog-mcp",
    "crates/klarbog-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Pellucid Software"]

[workspace.dependencies]
klarbog-types = { path = "crates/klarbog-types" }
klarbog-journal = { path = "crates/klarbog-journal" }
klarbog-store-sqlite = { path = "crates/klarbog-store-sqlite" }
klarbog-core = { path = "crates/klarbog-core" }
klarbog-plugin = { path = "crates/klarbog-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "fs", "signal"] }
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "uuid"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
strip = true
