<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Klarbog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <header class="top">
      <div class="brand-block">
        <p class="brand">Klarbog</p>
        <p class="tagline">Lokalt bogholderi — klart og i øre</p>
      </div>
      <nav class="nav" aria-label="Hovedmenu">
        <button type="button" data-view="home" class="nav-btn is-active">Oversigt</button>
        <button type="button" data-view="parties" class="nav-btn">Parter</button>
        <button type="button" data-view="invoices" class="nav-btn">Fakturaer</button>
        <button type="button" data-view="bank" class="nav-btn">Bank</button>
        <button type="button" data-view="bilag" class="nav-btn">Bilag</button>
        <button type="button" data-view="journal" class="nav-btn">Journal</button>
        <button type="button" data-view="chart" class="nav-btn">Kontoplan</button>
        <button type="button" data-view="settings" class="nav-btn">Indstillinger</button>
      </nav>
    </header>

    <main id="app" class="main"></main>

    <footer class="foot">
      <span>DEV · loopback API</span>
      <span id="foot-status">…</span>
    </footer>

    <script src="/ui/app.js" type="module"></script>
  </body>
</html>
